<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Qi Huang (Huang Qi)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.png" type="image/png" sizes="192x192">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t=="light"||t=="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
@font-face{font-family:"Newsreader";src:url(/assets/fonts/newsreader-roman.woff2) format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(/assets/fonts/newsreader-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{--bg:#f4f2eb;--ink:#1d1e19;--ink2:#45463e;--muted:#65655a;--rule:#d8d4c6;--moss:#2d5a3b;--rust:#99472a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121511;--ink:#e6e3d8;--ink2:#c2beb1;--muted:#9f9b8e;--rule:#2d322b;--moss:#98c6a2;--rust:#e3a07c}}
:root[data-theme=dark]{--bg:#121511;--ink:#e6e3d8;--ink2:#c2beb1;--muted:#9f9b8e;--rule:#2d322b;--moss:#98c6a2;--rust:#e3a07c;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 1.125rem/1.6 "Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:34rem;padding:3rem 1.25rem}
p{margin:0}
.code{font:.8125rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;color:var(--muted)}
.tr{position:relative;height:.5rem;margin:1rem 0 1.75rem;max-width:14rem;background:linear-gradient(var(--rule),var(--rule)) 0 50%/100% 1px no-repeat}
.tr::before{content:"";position:absolute;left:0;width:45%;top:.125rem;height:.25rem;background:var(--rust)}
h1{margin:0;font-weight:500;font-size:clamp(2.25rem,8vw,3rem);line-height:1.05;letter-spacing:-.02em}
.lede{margin-top:1rem;color:var(--ink2);font-style:italic}
ul{margin:2rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:0 1.75rem;font:.9375rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{display:inline-flex;align-items:center;min-height:2.75rem;color:var(--moss);text-decoration:underline 1px;text-decoration-color:color-mix(in srgb,currentColor 38%,transparent);text-underline-offset:.2em}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:2px}
</style>
</head>
<body>
<main>
  <p class="code">ERROR 404</p>
  <div class="tr" aria-hidden="true"></div>
  <h1>This path ends here.</h1>
  <p class="lede">The page you were looking for doesn&rsquo;t exist, or has moved.</p>
  <ul>
    <li><a href="/">Go to Qi Huang&rsquo;s homepage</a></li>
    <li><a href="/assets/file/Qi_Huang_CV.pdf">CV (PDF)</a></li>
  </ul>
</main>
</body>
</html>
