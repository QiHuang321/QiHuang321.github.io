.photo-link{position:relative;display:block;overflow:hidden;border-radius:3px;background:var(--bg2);text-decoration:none;cursor:zoom-in}
.photo-link img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:var(--focus,50% 50%);transition:transform .25s}
.photo-link:hover img{transform:scale(1.025)}
.photo-link:focus-visible{outline-offset:4px}
.photo-expand{position:absolute;right:.65rem;bottom:.65rem;display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;background:#121511c9;color:#fff;font:1rem/1 var(--sans);pointer-events:none}
.photo-grid figcaption{margin-top:.5rem;color:var(--muted);font:.8125rem/1.45 var(--sans)}
.photo-viewer{width:min(70rem,calc(100% - 2rem));max-width:none;max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);margin:auto;padding:1rem;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);overflow:auto}
.photo-viewer[open]{display:flex;flex-direction:column;gap:.75rem}
.photo-viewer::backdrop{background:#080b08d9}
.photo-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;font:.8125rem/1.4 var(--sans);color:var(--muted)}
.photo-controls{display:flex;align-items:center;gap:.4rem}
.photo-controls button{display:grid;place-items:center;min-width:2.75rem;min-height:2.75rem;padding:.4rem .7rem;border:1px solid var(--rule);border-radius:3px;background:var(--bg2);color:var(--ink);font:inherit;cursor:pointer}
.photo-controls button:hover{border-color:var(--moss)}
.photo-full{align-self:center;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 10rem);max-height:calc(100dvh - 10rem);min-height:0;object-fit:contain}
.photo-caption{color:var(--ink2);font:.875rem/1.5 var(--sans)}
.photo-open{overflow:hidden}
@media (max-width:28rem){.photo-grid{gap:1rem .75rem}.photo-grid figcaption{font-size:.75rem}.photo-viewer{width:calc(100% - 1rem);padding:.75rem}}
